<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creer groupe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-user-group" style="padding-left: 20px;"></i>
            <p>Split<span>Mate</span></p>
        </div>
        <div><i class="fa-solid fa-circle-user"style="padding-right: 20px;"></i></div>
    </header>
    <div class="Corps">
        <aside>
            <a href=""><i class="fa-solid fa-house"></i>Tableau de bord</a>
            <a href="groupe.html" class="selectionner"><i class="fa-solid fa-people-group"></i>Groupes</a>
            <a href="member.html"><i class="fa-solid fa-user"></i>Membres</a>
            <a href="depense.html"><i class="fa-solid fa-wallet"></i>Dépenses</a>
            <a href=""><i class="fa-solid fa-calculator"></i>Soldes & remboursements</a>
            <a href=""><i class="fa-solid fa-magnifying-glass"></i>Recherche & filtres</a>

        </aside>
        <main>
            <a href="groupe.html" style="text-decoration: none; color: black;"><i class="fa-solid fa-arrow-left-long"
                    style="font-size: 12px;" id="retour"></i> Retour</a>
            <section id="formulaire">
                <h2>Information du groupe</h2>
                <h3>Nom du groupe</h3>
                <div>
                    <input id="nomGroupe" placeholder="Ex: Voyage Marrakech">
                </div>

                <h3>Description</h3>
                <div><textarea id="description" rows="5" cols="60">Ex: Vacances entre amis.. </textarea></div>

                <div class="info">
                    <div>
                        <h3>Devise</h3>
                        <select id="devise">
                            <option value="MAD">MAD</option>
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>

                    <div>
                        <h3>Date de début</h3>
                        <input type="date" id="date">
                    </div>

                </div>
                <div style="padding-top: 20px;display: flex; gap:2%;">
                    <a href="groupe.html">Annuler</a>
                    <button id="enregistrer" onclick="creerGroup()" >Créer le groupe</button>
                </div>
            </section>

        </main>
        
    </div>

    <script src="js/groupes.js"></script>
</body>

</html>
