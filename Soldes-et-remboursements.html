<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page groupes</title>
    <link rel="stylesheet" href="css/soldes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-user-group" style="padding-left: 20px;"></i>
            <p>Split<span>Mate</span></p>
        </div>
        <div><i class="fa-solid fa-circle-user" style="padding-right: 20px;"></i></div>
    </header>

    <div class="Corps">
        <aside>
            <a href=""><i class="fa-solid fa-house"></i>Tableau de bord</a>
            <a href="groupe.html" class="selectionner"><i class="fa-solid fa-people-group"></i>Groupes</a>
            <a href="member.html"><i class="fa-solid fa-user"></i>Membres</a>
            <a href=""><i class="fa-solid fa-wallet"></i>Dépenses</a>
            <a href=""><i class="fa-solid fa-calculator"></i>Soldes & remboursements</a>
            <a href=""><i class="fa-solid fa-magnifying-glass"></i>Recherche & filtres</a>

        </aside>
        <main>
            <section class="titles">
                <div class="title">
                    <h1> <i class="fa-solid fa-users"></i> Soldes & Remboursements</h1>
                    <p>Consultez les soldes de chaque membre et gérez les remboursements.</p>
                </div>
                <div class="groupes">

                    <select id="select-groupe">
                    <option value="">Choisir un groupe</option>
                </select>
                </div>

            </section>
            <section class="rembersements">
            <section id="carte">
                <div class="icon1"> <i class="fa-solid fa-wallet"></i></div>
                <div class="total-des-depenses">
                    <h3>Total des depense</h3>
                    <h4>2500DH</h4>
                     
                </div>
            </section>

             <section id="recevoir">
                <div class="icon2"> <i class="fa-solid fa-circle-arrow-up"></i></div>
                <div class="recevoire">
                    <h3>A recevoir</h3>
                    <h4>800DH</h4>
                     
                </div>
            </section>
            
             <section id="rembourser">
                <div class="icon3"><i class="fa-solid fa-circle-arrow-down"></i></div>
                <div class="remberse">
                    <h3>A rembourser</h3>
                    <h4>800DH</h4>
                     
                </div>
            </section>

             <section id="rembourse-effectué">
                <div class="icon4"><i class="fa-solid fa-circle-check"></i></div>
                <div class="remberse-effect">
                    <h3>Remboursements effectués</h3>
                    <h4>1350DH</h4>
                     
                </div>
            </section>
</section>
</main>
